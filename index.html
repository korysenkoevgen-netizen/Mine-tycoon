<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шахта-тайкун</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a8de0">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Шахта">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--menu-bg:#bfe6ff;--menu-bg2:#e3f4ff;--ink:#12344d;--card:#ffffff;--accent:#2a8de0;--accent-d:#1c6fb8;--gold:#f2b705;--soft:#d6ecfb;--lvl-bg:#eaf6ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#173247;--ink:#eaf5ff;--soft:#24465f;--lvl-bg:#0f2433;color-scheme:dark}}
:root[data-theme="dark"]{--card:#173247;--ink:#eaf5ff;--soft:#24465f;--lvl-bg:#0f2433}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--menu-bg)}
.screen{display:none;height:100%;padding:20px;flex-direction:column;align-items:center}
.screen.on{display:flex}
#menu{position:relative;isolation:isolate;justify-content:center;background:linear-gradient(180deg,#8fd0ff,#dff3ff 70%);color:#12344d}
#menu h1{font-size:2.2rem;margin:0 0 6px;text-align:center}
.sky{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.sky svg.mt{position:absolute;left:0;bottom:0;width:100%;height:60%}
.cloud{position:absolute;left:0;width:70px;height:22px;background:#fff;border-radius:99px;opacity:.9;animation:drift 90s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{left:12px;top:-12px;width:30px;height:30px}.cloud::after{left:34px;top:-8px;width:24px;height:24px}
.c1{top:12%;animation-delay:-20s}.c2{top:26%;scale:.7;animation-duration:130s;animation-delay:-80s}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
@media (prefers-reduced-motion:reduce){.cloud{animation:none}}
#menu p{margin:0 0 28px;opacity:.7}
.btn{width:min(320px,100%);padding:16px 20px;font-size:1.15rem;font-weight:700;border:0;border-radius:16px;background:var(--accent);color:#fff;margin:7px 0;cursor:pointer;box-shadow:0 4px 0 var(--accent-d);display:flex;justify-content:space-between;align-items:center}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-d)}
.btn.off{background:#fff;color:#4d7391;box-shadow:0 4px 0 #a9cbe3}
.btn.lock{background:#c9d1d8;color:#6b7782;box-shadow:0 4px 0 #a3adb6}
.btn small{font-size:.75rem;font-weight:600;background:#d6ecfb;color:#3b6e92;padding:3px 9px;border-radius:99px}
.corner{position:absolute;top:16px;right:16px;display:flex;gap:8px}
.ic{position:relative;width:44px;height:44px;border:0;border-radius:14px;background:#fff;font-size:1.3rem;box-shadow:0 3px 0 #a9cbe3;color:#12344d;padding:0}
.ic.mute{opacity:.6}
.ic.mute::after{content:"";position:absolute;left:18%;right:18%;top:50%;border-top:3px solid #d0453d;border-radius:2px;transform:rotate(-45deg)}
#lgm{position:fixed;inset:0;background:rgba(10,30,50,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#lgm.on{display:flex}
#lgm .box{background:#e3f4ff;color:#12344d;border-radius:22px;padding:20px;width:min(320px,100%);text-align:center}
#lgm h3{margin:0 0 10px;font-size:1.2rem}
#lgm .btn{width:100%}
#ver{position:fixed;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:.8rem;font-weight:600;color:#12344d;opacity:.6}
#game{background:linear-gradient(#2b1d12,#120c08);padding:14px;overflow:hidden}
#game .top .g{background:rgba(255,255,255,.16);color:#fff}
#game .money{color:#fff}
#game #list{border-radius:16px;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.surf{height:46px;background:linear-gradient(#8fd3ff 0 52%,#5aa83c 52% 78%,#6b4a2b 78%);display:flex;align-items:flex-end;justify-content:space-around;font-size:1.5rem;line-height:1;padding-bottom:2px}
#game .fl{margin:0;border-radius:0;border-bottom:3px solid rgba(0,0,0,.4);box-shadow:inset 0 0 30px rgba(0,0,0,.35);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
#game .fl .rt{color:#ffe27a}
#game .fl .b2{background:var(--accent);text-shadow:none}
#game .fl .b2.g{background:rgba(255,255,255,.2)}
#game .pb{background:rgba(0,0,0,.4)}
#game.ice{background:linear-gradient(#0d2a44,#06121f)}
.surf.ice{background:radial-gradient(ellipse at 28% 0%,rgba(80,255,180,.6),transparent 60%),radial-gradient(ellipse at 78% 0%,rgba(180,110,255,.55),transparent 60%),linear-gradient(#0b2a4a 0 40%,#f2fbff 40% 78%,#cfe3ee 78%)}
#pi svg{width:22px;height:22px;display:block}
.wc.off{opacity:.55}
#mus{background:linear-gradient(180deg,var(--menu-bg2),var(--menu-bg));color:#12344d;justify-content:flex-start;overflow-y:auto}
#ml{width:min(420px,100%)}
#game.lava{background:linear-gradient(#2a0d08,#120504)}
.surf.lava{background:radial-gradient(ellipse at 50% 100%,rgba(255,120,30,.55),transparent 65%),linear-gradient(#2b0d0d 0 45%,#6b1d0a 45% 78%,#2a1a14 78%)}
#vrow,#frow{width:min(480px,100%);align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
#vlr,#flr{flex:1;color:#ffd9a8;font-size:.8rem;text-align:left}
#volBtn,#fishBtn{width:56px;height:56px;flex:none;border:0;border-radius:14px;background:linear-gradient(135deg,#c2310b,#ff8a1f);color:#fff;font-size:1.5rem;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 #7a1d05;padding:0}
#volBtn small,#fishBtn small{font-size:.6rem;font-weight:800;margin-top:2px}
#volBtn.hot,#fishBtn.hot{background:linear-gradient(135deg,#ff8a1f,#ffd84d);color:#3b1d00;box-shadow:0 3px 0 #b86a00;animation:pulse 1s infinite alternate}
#vm{position:fixed;inset:0;background:rgba(10,5,2,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#vm.on{display:flex}
#vm .box{background:#2a1008;color:#ffe6c8;border-radius:22px;padding:18px;width:min(340px,100%);text-align:center;box-shadow:0 0 30px rgba(255,100,20,.35)}
#vm h3{margin:0 0 10px;font-size:1.2rem}#vm .btn{width:100%;justify-content:center;background:linear-gradient(90deg,#c2310b,#ff8a1f);box-shadow:0 4px 0 #7a1d05}
#vm .btn:disabled{opacity:.45}
.vl{display:flex;justify-content:space-between;padding:8px 10px;border-radius:10px;margin:4px 0;font-weight:700;font-size:.88rem;text-align:left}
.vl.lava{background:linear-gradient(90deg,#c2310b,#ff8a1f);color:#fff}
.vl.cur{box-shadow:0 0 0 2px #ffd84d,0 0 14px #ff8a1f}
.vl.done{background:#3a2a24;color:#8a7a70;text-decoration:line-through}
#vS{font-weight:800;margin:10px 0 4px}#vR{min-height:20px;color:#ffd9a8;font-size:.85rem;margin-bottom:8px}
#flr{color:#bfe9ff!important}
#fishBtn{background:linear-gradient(135deg,#1d7fc4,#33c9e8);box-shadow:0 3px 0 #0b3a6a}
#fishBtn.hot{background:linear-gradient(135deg,#33c9e8,#b8f3ff);color:#06284a;box-shadow:0 3px 0 #1d7fc4}
#game.sea{background:linear-gradient(#06284a,#020d1c)}
.surf.sea{background:radial-gradient(ellipse at 30% 0%,rgba(180,240,255,.5),transparent 60%),linear-gradient(#7fd8ff 0 35%,#1d7fc4 35% 70%,#0b3a6a 70%)}
#fm{position:fixed;inset:0;background:rgba(2,10,24,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#fm.on{display:flex}
#fm .box{background:#08284a;color:#d8f4ff;border-radius:22px;padding:18px;width:min(340px,100%);text-align:center;box-shadow:0 0 30px rgba(60,180,255,.35)}
#fm h3{margin:0 0 10px;font-size:1.2rem}#fm .btn{width:100%;justify-content:center;background:linear-gradient(90deg,#1d7fc4,#33c9e8);box-shadow:0 4px 0 #0b3a6a}
#fm .btn:disabled{opacity:.45}
.fgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fk{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 2px;font-size:1.4rem;line-height:1.1}
.fk.off{opacity:.4}.fk small{display:block;font-size:.5rem;margin-top:2px;line-height:1.1}
#fB{font-weight:800;margin:10px 0 2px}#fI{font-size:.75rem;opacity:.75;margin-bottom:6px}
#fS{font-weight:800;margin:8px 0 2px}#fR{min-height:20px;color:#9fe4ff;font-size:.85rem;margin-bottom:8px}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 40%,#fff6c8,#ff9a3d 40%,rgba(255,60,0,.6) 75%);z-index:8}
#flash.go{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:0}18%{opacity:.85}100%{opacity:0}}
.exb{width:min(480px,100%);border:0;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-weight:800;font-size:.95rem;background:linear-gradient(90deg,#2a8de0,#5fd0ff);color:#fff;box-shadow:0 3px 0 #1c6fb8}
.exb.lock{background:#4b5b68;color:#c7d2da;box-shadow:0 3px 0 #2f3b45}
.exb.hot{background:linear-gradient(90deg,#f2b705,#ffd84d);color:#3b2d00;box-shadow:0 3px 0 #b88a00;animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.02)}}
#pix{background:linear-gradient(180deg,var(--menu-bg2),var(--menu-bg));color:#12344d;justify-content:flex-start;overflow-y:auto}
#pl{width:min(420px,100%)}.ph{font-weight:800;margin:12px 0 6px}
.pcard{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:0 3px 0 #a9cbe3}
.pcard.off{opacity:.55}.pcard .pi{font-size:1.8rem;width:36px;text-align:center}.pcard .pi svg{width:30px;height:30px;display:block;margin:auto}
.pcard small{display:block;opacity:.75}
#exm{position:fixed;inset:0;background:rgba(10,30,50,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#exm.on{display:flex}
#exm .box{background:#e3f4ff;color:#12344d;border-radius:22px;padding:20px;width:min(340px,100%);text-align:center}
#exm h3{margin:0 0 8px;font-size:1.2rem}#exm .btn{width:100%;justify-content:center}
#exI{opacity:.75;font-size:.82rem;margin:6px 0 10px}#exS{font-weight:800;margin:8px 0}#exBo{font-weight:700;color:#b87d00}#exR{font-weight:700;color:#1c6fb8;margin:6px 0;min-height:20px}
#wrl{background:linear-gradient(180deg,var(--menu-bg2),var(--menu-bg));color:#12344d;justify-content:flex-start;overflow-y:auto}
.wtop{width:min(420px,100%);display:flex;align-items:center;gap:12px;margin-bottom:14px}
.wtop button{border:0;border-radius:12px;background:#fff;color:#12344d;font-weight:700;padding:10px 14px;font-size:.95rem}
.wtop h2{margin:0;font-size:1.3rem}
.wc{width:min(420px,100%);background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 4px 0 #a9cbe3}
.wc.cur{outline:3px solid var(--accent)}
.wc b{font-size:1.1rem}.wc .d{display:block;opacity:.7;margin:2px 0 8px}
.wbar{height:10px;border-radius:9px;background:#d6ecfb;overflow:hidden;margin:8px 0 4px}
.wbar i{display:block;height:100%;background:var(--accent)}
.wc .b2{width:100%;margin-top:8px}
.top{width:min(480px,100%);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top button,.b2{border:0;border-radius:12px;font-weight:700;font-size:.95rem;background:var(--accent);color:#fff;padding:10px 12px}
.top .g,.b2.g{background:var(--soft);color:var(--ink)}
.money{flex:1;text-align:center;font-size:1.25rem;font-weight:800;line-height:1.1}
.money small{display:block;font-size:.75rem;font-weight:600;opacity:.65}
.b2:disabled{opacity:.4}
.pick{display:flex;flex-direction:column;align-items:center;line-height:1;padding:6px 8px!important;font-size:1.2rem!important}
.pick small{font-size:.55rem;margin-top:3px;white-space:nowrap;font-weight:700}
#list{width:min(480px,100%);flex:1;overflow-y:auto;padding-bottom:12px}
.fl{background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 4px 14px rgba(30,90,140,.12)}
.fh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.em{font-size:1.8rem}.fh div{flex:1}.fh small{opacity:.65;font-weight:600}
.rt{font-weight:800;color:var(--accent)}
.pb{position:relative;height:38px;border-radius:12px;background:var(--soft);overflow:hidden;cursor:pointer}
.pb i{position:absolute;inset:0 auto 0 0;background:var(--gold);width:0;opacity:.75}
.pb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800}
.fr{display:flex;gap:8px;margin-top:8px}.fr .b2{flex:1;line-height:1.25}
#buy{width:min(480px,100%);justify-content:center;margin:2px 0 0;font-size:1rem}
#buy:disabled{opacity:.45}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#12344d;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;font-weight:600;text-align:center;max-width:90%;z-index:9}
#toast.show{opacity:1}
</style>
</head>
<body>
<section id="menu" class="screen on">
  <div class="sky" aria-hidden="true">
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <svg class="mt" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice">
      <defs>
        <g id="pine"><rect x="-2" y="0" width="4" height="10" fill="#6b4a2b"/><polygon points="0,-26 -13,2 13,2" fill="#2f7d3a"/><polygon points="0,-40 -10,-14 10,-14" fill="#3b9142"/></g>
        <g id="rtree"><rect x="-2" y="-2" width="4" height="14" fill="#6b4a2b"/><circle cy="-14" r="13" fill="#3f9b3f"/><circle cx="-8" cy="-8" r="9" fill="#4cae48"/><circle cx="8" cy="-9" r="9" fill="#4cae48"/></g>
      </defs>
      <polygon points="0,300 0,150 45,100 90,140 140,70 200,145 250,95 310,150 360,105 400,140 400,300" fill="#9fb9d6"/>
      <polygon points="140,70 126,92 134,88 141,96 148,88 156,93" fill="#fff"/>
      <polygon points="250,95 238,115 245,111 251,119 258,112 264,116" fill="#fff"/>
      <polygon points="45,100 34,118 41,115 46,122 52,116 57,119" fill="#fff"/>
      <polygon points="0,300 0,200 70,140 130,195 190,125 255,200 320,150 400,205 400,300" fill="#7c9cc0"/>
      <polygon points="190,125 175,148 184,144 191,153 199,145 207,150" fill="#fff"/>
      <path d="M0 300 L0 215 Q70 185 140 215 T280 210 T400 205 L400 300Z" fill="#6fbf5a"/>
      <use href="#pine" transform="translate(30 222)"/><use href="#pine" transform="translate(58 218) scale(.8)"/>
      <use href="#rtree" transform="translate(300 222) scale(.8)"/><use href="#pine" transform="translate(345 214) scale(.9)"/>
      <path d="M0 300 L0 252 Q100 226 200 250 T400 246 L400 300Z" fill="#4fa83e"/>
      <use href="#rtree" transform="translate(110 262)"/><use href="#pine" transform="translate(235 262) scale(1.1)"/><use href="#rtree" transform="translate(372 266) scale(1.1)"/>
      <circle cx="60" cy="282" r="2.5" fill="#ff5a6e"/><circle cx="160" cy="277" r="2.5" fill="#ffd84d"/><circle cx="285" cy="284" r="2.5" fill="#fff"/><circle cx="335" cy="279" r="2.5" fill="#ff5a6e"/>
    </svg>
  </div>
  <div class="corner"><button class="ic" id="bm">🎵</button><button class="ic" id="bs">🔊</button></div>
  <h1 data-t="title"></h1>
  <p data-t="sub"></p>
  <button class="btn" id="start"><span data-t="start"></span><span>▶</span></button>
  <button class="btn lock" id="world"><span><span id="wi">🔒</span> <span data-t="world"></span></span><small id="ws" data-t="soon"></small></button>
  <button class="btn lock" id="museum"><span><span id="mi">🔒</span> <span data-t="museum"></span></span></button>
  <button class="btn off" id="lang"><span data-t="lang"></span><small id="lc"></small></button>
  <button class="btn off" id="inst"><span data-t="inst"></span><span>📲</span></button>
  <div id="ver"></div>
</section>
<section id="game" class="screen">
  <div class="top"><button class="g" id="toMenu">☰</button><div class="money"><span id="cu">💰</span> <span id="mo">0</span><small id="ips"></small></div><button class="g" id="mode">×1</button><button class="g pick" id="pick"><span id="pi">⛏️</span><small id="pk"></small></button></div>
  <button class="exb" id="exBtn" style="display:none"></button>
  <div id="vrow" style="display:none"><div id="vlr"></div><button id="volBtn"></button></div>
  <div id="frow" style="display:none"><div id="flr"></div><button id="fishBtn"></button></div>
  <div id="list"></div>
  <button class="btn" id="buy"></button>
</section>
<section id="wrl" class="screen"><div class="wtop"><button id="wBack" data-t="back"></button><h2 data-t="wt"></h2></div>
<button class="btn" id="pidx" style="margin:0 0 12px;width:min(420px,100%)"><span data-t="pidx"></span></button>
<div class="wc" id="wc1"><b>🌍 <span data-t="w1"></span></b><span class="d" data-t="w1d"></span><button class="b2" id="goW1" data-t="go"></button></div>
<div class="wc" id="wc2"><b>❄️ <span data-t="w2"></span></b><span class="d" data-t="w2d"></span><div class="wbar" id="wbar"><i id="wf"></i></div><small id="wn"></small><button class="b2" id="goW" data-t="go"></button></div>
<div class="wc" id="wc3"><b>🌋 <span data-t="w3"></span></b><span class="d" data-t="w3d"></span><div class="wbar" id="wbar3"><i id="wf3"></i></div><small id="wn3"></small><button class="b2" id="goW3" data-t="go"></button></div>
<div class="wc" id="wc4"><b>🌊 <span data-t="w4"></span></b><span class="d" data-t="w4d"></span><div class="wbar" id="wbar4"><i id="wf4"></i></div><small id="wn4"></small><button class="b2" id="goW4" data-t="go"></button></div></section>
<section id="mus" class="screen"><div class="wtop"><button id="mBack" data-t="back"></button><h2 data-t="museum"></h2></div><div id="ml"></div></section>
<section id="pix" class="screen"><div class="wtop"><button id="pBack" data-t="back"></button><h2 data-t="pidx"></h2></div><div id="pl"></div></section>
<div id="fm"><div class="box"><h3>🎣 <span data-t="fish"></span></h3><div class="fgrid" id="fG"></div><div id="fB"></div><div id="fI"></div><div id="fS"></div><div id="fR"></div><button class="btn" id="fGo"></button><button class="b2 g" id="fX" data-t="close" style="width:100%;margin-top:8px"></button></div></div>
<div id="vm"><div class="box"><h3>🌋 <span data-t="vol"></span></h3><div id="vL"></div><div id="vS"></div><div id="vR"></div><button class="btn" id="vGo"></button><button class="b2 g" id="vX" data-t="close" style="width:100%;margin-top:8px"></button></div></div>
<div id="exm"><div class="box"><h3>🚚 <span data-t="exT"></span></h3><div id="exI"></div><div class="wbar"><i id="exF"></i></div><div id="exS"></div><div id="exBo"></div><div id="exR"></div><button class="btn" id="exGo"></button><button class="b2 g" id="exX" data-t="close" style="width:100%;margin-top:8px"></button></div></div>
<div id="lgm"><div class="box"><h3 data-t="lang"></h3><button class="btn off" id="lgR">Русский <b id="ckR"></b></button><button class="btn off" id="lgE">English <b id="ckE"></b></button></div></div>
<div id="flash"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);

function volBtnUpdate(){const r=$('#vrow');if(S.w!==2){r.style.display='none';return}

function volGo(){

  const z=S.z[2],L=(S.vl?S.vl.n:0)+1,inc=Math.max(z.floors.reduce((s,f,i)=>s+rate(f,i,2),0),1);

const FISH_CD=180000;

function fishGo(){

  const z=S.z[3];let u=Math.random()*100,k=0;
  for(;k<FISH.length-1;k++){if(u<FISH[k].w)break;u-=FISH[k].w}

    const r=rate(f,i),m=mult(f),n=nUp(f,i),uc=upg(f,i,Math.max(n,0)),mc=mgrCost(i);
